<!doctype html>
<html lang="id">
<head>

<style>
/* Layout: sidebar menu + kolom isi; di HP menu jadi baris geser. Warna dari infografik 50/30/20. */
:root{--bg:#f6faff;--card:#fff;--fg:#253858;--mut:#566783;--line:#dfe9f5;--pri:#a9d1f7;--onpri:#17324f;--hero:#cfe5fc;
--needs:#79b4ec;--wants:#f5cc55;--save:#7fccae;--acc:#f3c64a;--good:#1c7451;--warn:#855800;--bad:#b83b48;--soft:#eaf3fd;--glow1:#fff5cf;--glow2:#ddedff;--t1:#2a5d92;--t2:#2a5d92;
--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a26;--card:#1a2636;--fg:#e8f0fa;--mut:#a4b5ca;--line:#2d3f56;--pri:#9cc8f2;--onpri:#10263d;--hero:#243b56;--needs:#86bdef;--wants:#f2d27a;--save:#8bd3b6;--acc:#f2d27a;--good:#7fd6ad;--warn:#f2cf74;--bad:#f59aa2;--soft:#233348;--glow1:#2a2718;--glow2:#172c45;--t1:#b4d6f7;--t2:#b4d6f7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a26;--card:#1a2636;--fg:#e8f0fa;--mut:#a4b5ca;--line:#2d3f56;--pri:#9cc8f2;--onpri:#10263d;--hero:#243b56;--needs:#86bdef;--wants:#f2d27a;--save:#8bd3b6;--acc:#f2d27a;--good:#7fd6ad;--warn:#f2cf74;--bad:#f59aa2;--soft:#233348;--glow1:#2a2718;--glow2:#172c45;--t1:#b4d6f7;--t2:#b4d6f7;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;max-width:1180px;margin:auto;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:14px;min-width:0}
.brand{font-weight:800;font-size:22px;display:flex;gap:10px;align-items:center}
nav{display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:12px;display:flex;gap:10px;align-items:center;font-weight:600;color:var(--mut);white-space:nowrap}
nav button[aria-current="true"]{background:var(--pri);color:var(--onpri)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{font-size:23px;margin:0}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:20px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between}
.hero small{opacity:.85;display:block}.hero b{font-size:20px}.hero .big{font-size:32px;font-weight:800}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.s{padding:4px 10px;font-size:12px}.btn.d{color:var(--bad)}
input,select,textarea{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12.5px;color:var(--mut)}
label input,label select,label textarea{color:var(--fg);font-size:14px;font-weight:500}
.filters>*{width:auto;flex:1 1 140px}
.mut{color:var(--mut)}.sm{font-size:12px}.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.ico{--c:#04758f;width:40px;height:40px;flex:none;border-radius:13px;display:inline-grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c) 20%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.ico.s{width:30px;height:30px;border-radius:10px;font-size:16px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}.item .r{text-align:right}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--soft)}
.note{background:var(--soft);border-radius:12px;padding:10px 14px}
.donut{width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center}
.donut.big{width:210px;height:210px}.donut.big span{width:136px;height:136px}.donut span{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.chart{display:flex;gap:6px;overflow-x:auto;align-items:flex-end;padding-top:4px}
.chart div{flex:1 0 46px;text-align:center;font-size:11px;color:var(--mut)}
.chart s{display:block;text-decoration:none;border-radius:6px 6px 2px 2px;background:var(--wants);margin:3px 6px}
.chart div:last-child s{background:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(0,20,25,.55);display:grid;place-items:center;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--card);border-radius:18px;width:min(460px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-weight:600;width:max-content;max-width:90%}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.3);border-radius:99px;padding:13px 20px;background:var(--acc);border-color:var(--acc);color:#fff}
.theme{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;width:max-content}.theme button{width:36px;height:36px;font-size:18px;border:0;border-radius:50%;background:transparent;cursor:pointer;padding:0}.theme button[aria-pressed="true"]{background:linear-gradient(135deg,#ffd36b,#ff8a5c);box-shadow:0 2px 8px rgba(255,138,92,.5)}.theme button[data-theme-set="dark"][aria-pressed="true"]{background:linear-gradient(135deg,#38bdf8,#1e4e8c);box-shadow:0 2px 8px rgba(56,189,248,.45)}
/* warna cerah */
body{background:radial-gradient(900px 500px at 0 0,var(--glow1),transparent 70%),radial-gradient(900px 600px at 100% 20%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed}
.logo{background:linear-gradient(135deg,#ffc857,#ff8a3d 50%,#14b8a6);box-shadow:0 4px 12px rgba(255,138,61,.4)}
.word{background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{color:var(--t1)}
nav button{--n:#047690}
nav button .ni{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--n) 22%,var(--card))}
nav button[aria-current="true"]{background:linear-gradient(100deg,#047690,#0b7f6c);color:#fff;box-shadow:0 5px 14px rgba(4,118,144,.35)}
nav button[aria-current="true"] .ni{background:rgba(255,255,255,.25)}
.hero{background:linear-gradient(125deg,#075985,#047690 50%,#0f766e);box-shadow:0 10px 26px rgba(4,118,144,.3)}
.stat{background:rgba(255,255,255,.17);border-radius:14px;padding:10px 14px}
.acc{color:#fff;border:0;background:linear-gradient(135deg,var(--a),var(--b))}
.acc .mut{color:#fff;opacity:.9}.acc .ico{background:rgba(255,255,255,.25);box-shadow:none}.acc .btn{background:#fff;color:#10323d;border:0}.acc .btn.d{color:#b3261e}

.tint{background:linear-gradient(160deg,color-mix(in srgb,var(--k) 18%,var(--card)),var(--card) 65%);border-color:color-mix(in srgb,var(--k) 40%,var(--line))}
.btn.p{background:linear-gradient(100deg,#047690,#0b7f6c);border-color:transparent;color:#fff}
.fab{background:linear-gradient(120deg,#c2410c,#dc4c1e);border:0}
.bar{height:10px}
.pc{font-size:17px;font-weight:800}
.hero{background:linear-gradient(120deg,var(--hero),var(--hero2));color:var(--fg);box-shadow:0 8px 22px rgba(80,130,190,.15)}
.hero small{color:var(--mut);opacity:1}.stat{background:color-mix(in srgb,var(--card) 65%,transparent)}
.logo{background:linear-gradient(135deg,#ffe9a3,#bfddfb);box-shadow:0 4px 12px rgba(80,130,190,.2)}
nav button[aria-current="true"]{background:var(--pri);color:var(--onpri);box-shadow:0 4px 12px rgba(80,130,190,.2)}
.btn.p,.btn.fab{border:0;color:var(--onpri);background:var(--pri)}
.btn.fab{background:#ffda6a;color:#3d3000;box-shadow:0 6px 18px rgba(120,95,10,.28)}
.acc{color:var(--fg);background:var(--a);border:1px solid var(--line)}
.acc .mut{color:var(--mut);opacity:1}.acc .ico{background:color-mix(in srgb,var(--card) 70%,transparent)}
.acc .btn{background:var(--card);color:var(--fg);border:1px solid var(--line)}.acc .btn.d{color:var(--bad)}.acc .num.bad{color:var(--bad)}
.acc-cash{--a:var(--c-cash)}.acc-ewallet{--a:var(--c-ew)}.acc-bank{--a:var(--c-bank)}
.theme button[data-theme-set][aria-pressed="true"]{background:#ffe08a;box-shadow:none}
.theme button[data-theme-set="dark"][aria-pressed="true"]{background:#a9d1f7}
.chart div:last-child s{background:#f5cc55}.chart s{background:#8fc2f0}
.toast{background:var(--fg)}
:root{--hero2:#fff0b8;--c-cash:#fff3c4;--c-bank:#d8eafd;--c-ew:#e0f4fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero2:#4a4328;--c-cash:#3b3620;--c-bank:#213a56;--c-ew:#1d3d47}}
:root[data-theme="dark"]{--hero2:#4a4328;--c-cash:#3b3620;--c-bank:#213a56;--c-ew:#1d3d47}
@media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr);gap:14px}aside{position:static}nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}nav button{padding:8px 11px}}
</style>

<body>
<div class="shell">
<aside><div class="brand"><span class="ico logo">👛</span><span class="word">DompetKu</span></div><div class="theme" role="group" aria-label="Mode tampilan"><button data-theme-set="light" aria-label="Mode terang" title="Mode terang">☀️</button><button data-theme-set="dark" aria-label="Mode gelap" title="Mode gelap">🌙</button></div><nav id="nav" aria-label="Menu"></nav><div class="sm mut">Data tersimpan di browser ini, tanpa database. Cadangkan secara rutin.</div></aside>
<main id="main"></main>
</div>
<button class="btn fab" data-a="tx">＋ Catat</button>
<div id="modal"></div><div id="toast" role="status"></div>
<script>
const KEY='dompetku_v1';
const GROUPS={needs:{n:'Kebutuhan',c:'var(--needs)'},wants:{n:'Keinginan',c:'var(--wants)'},save:{n:'Tabungan',c:'var(--save)'}};
const TYPES={cash:{n:'Dompet / Cash',i:'💵',c:'#3f9d4a'},ewallet:{n:'E-Wallet',i:'📱',c:'#d9660f'},bank:{n:'ATM / Bank',i:'🏦',c:'#1f6fbf'}};
// [id, nama, ikon, warna, grup, [[id, nama, ikon, bobotAwal, tetap]]]
const DEF=[
['rumah','Perumahan','🏠','#d9822b','needs',[['sewa','Sewa / KPR','🏡',22,1],['ipl','Iuran & kebersihan','🧹',2,1],['perbaikan','Perbaikan rumah','🔧',2]]],
['makan','Makanan','🍽️','#e0533d','needs',[['dapur','Belanja dapur','🛒',20],['harian','Makan harian','🍛',12],['galon','Air minum / galon','🚰',2]]],
['utilitas','Utilitas','💡','#d4a017','needs',[['listrik','Listrik / token','⚡',7,1],['pdam','Air PDAM','💧',3,1],['internet','Internet / WiFi','📶',5,1],['pulsa','Pulsa & kuota','📲',3],['gas','Gas LPG','🔥',2]]],
['transport','Transportasi','🛵','#2b87c9','needs',[['bensin','Bensin','⛽',8],['umum','Ojek & transum','🚌',3],['servis','Servis kendaraan','🛠️',2]]],
['sehat','Kesehatan','🩺','#d6456f','needs',[['obat','Obat & vitamin','💊',2],['dokter','Dokter / klinik','🏥',2]]],
['asuransi','Asuransi','🛡️','#1f6f8b','needs',[['bpjs','BPJS Kesehatan','🪪',3,1],['asuransilain','Asuransi lain','☂️',2,1]]],
['lainwajib','Wajib lainnya','📌','#6b7f86','needs',[['sekolah','Pendidikan','🎒',0,1],['cicilan','Cicilan / utang','💳',0,1],['admin','Biaya admin','🧾',1]]],
['rawat','Perawatan diri','💆','#e0702f','wants',[['salon','Salon & pangkas','💇',20],['skincare','Skincare & kosmetik','🧴',20]]],
['hibur','Hiburan','🎬','#0e8f9e','wants',[['jajan','Jajan & nongkrong','☕',25],['nonton','Nonton & rekreasi','🎡',15]]],
['hobi','Hobi','🎨','#2fa894','wants',[['hobiku','Hobi','🎮',10],['belanja','Belanja pribadi','🛍️',15]]],
['langgan','Langganan','🔁','#2563a8','wants',[['streaming','Streaming video/musik','📺',10,1],['aplikasi','Aplikasi & cloud','☁️',5,1]]],
['simpan','Tabungan & investasi','🐷','#5c9e3a','save',[['darurat','Dana darurat','🚨',50],['tabungan','Tabungan tujuan','🎯',20],['pensiun','Dana pensiun','👴',15],['investasi','Investasi','📈',15]]]
];
const INC=[['gaji','Gaji','💼'],['bonus','Bonus / THR','🎁'],['usaha','Hasil usaha','🏪'],['freelance','Freelance','💻'],['lainmasuk','Pemasukan lain','💰']];
const defCats=()=>DEF.map(([id,n,i,c,g,s])=>({id,n,i,c,g,subs:s.map(([id,n,i,w,f])=>({id,n,i,w,f:!!f}))}));
const blank=()=>({v:1,demo:false,accounts:[{id:'cash',name:'Dompet',type:'cash',open:0,icon:'👛'}],cats:defCats(),tx:[],bills:[],tokens:[],debts:[],pct:{needs:50,wants:30,save:20},incomePlan:0,budgets:{}});

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n||0)).toLocaleString('id-ID');
const dec=n=>(+n||0).toLocaleString('id-ID',{maximumFractionDigits:2});
const digits=s=>+String(s).replace(/\D/g,'')||0;
const decimal=s=>{s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.max(0,parseFloat(s)||0)};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const pdate=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c||1)};
const days=(a,b)=>Math.round((pdate(b)-pdate(a))/864e5);
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return iso(d)};
const addM=(m,n)=>{const d=pdate(m+'-01');d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)};
const mName=(m,short)=>pdate(m+'-01').toLocaleDateString('id-ID',{month:short?'short':'long',year:short?'2-digit':'numeric'});
const dName=s=>pdate(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const dayIn=(m,day)=>{const d=pdate(m+'-01');const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return m+'-'+pad(Math.min(day,last))};
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);

// jenis tagihan: [id, nama, ikon, sub kategori]
const KINDS=[['pdam','PDAM','💧','pdam'],['token','Token Listrik','⚡','listrik'],['listrik','Listrik Pascabayar','💡','listrik'],['wifi','WiFi / Internet','📶','internet'],['pulsa','Pulsa & Kuota','📲','pulsa'],['bpjs','BPJS Kesehatan','🪪','bpjs'],['asuransi','Asuransi','☂️','asuransilain'],['sewa','Sewa / KPR','🏡','sewa'],['iuran','Iuran Lingkungan','🧹','ipl'],['sekolah','Pendidikan','🎒','sekolah'],['cicilan','Cicilan','💳','cicilan'],['streaming','Langganan','📺','streaming'],['lain','Lainnya','📌','']];
const kindOf=k=>KINDS.find(x=>x[0]===k)||KINDS.at(-1);
// menyesuaikan data versi lama: satu dompet cash, meteran token menjadi tagihan
const WARNA_LAMA={['#7a52'+'c7']:'#0e8f9e',['#5a6a'+'cf']:'#2563a8',['#4a67'+'c9']:'#1f6f8b',['#c056'+'9f']:'#e0702f'};
function normalize(d){d.cats.forEach(c=>{if(WARNA_LAMA[c.c])c.c=WARNA_LAMA[c.c]});d.debts=Array.isArray(d.debts)?d.debts:[];
const cash=d.accounts.filter(a=>a.type==='cash');
if(!cash.length)d.accounts.unshift({id:'cash'+(d.accounts.some(a=>a.id==='cash')?uid():''),name:'Dompet',type:'cash',open:0,icon:'👛'});
else if(cash.length>1){const main=cash[0],gone=new Set(cash.slice(1).map(a=>a.id));cash.slice(1).forEach(a=>main.open+=a.open);
[...d.tx,...d.tokens,...d.bills].forEach(t=>{if(gone.has(t.acc))t.acc=main.id;if(gone.has(t.to))t.to=main.id});
d.tx=d.tx.filter(t=>!(t.type==='move'&&t.acc===t.to&&!t.sub));d.accounts=d.accounts.filter(a=>!gone.has(a.id))}
d.bills.forEach(b=>{if(!b.kind)b.kind=KINDS.find(k=>k[0]!=='token'&&k[0]!=='listrik'&&k[3]===b.sub)?.[0]||(b.sub==='listrik'?'listrik':'lain')});
d.tokens.forEach(t=>{if(d.bills.some(b=>b.id===t.bid&&b.kind==='token'))return;const name=t.meter||'Rumah';let b=d.bills.find(b=>b.kind==='token'&&b.name===name);if(!b){b={id:'tm'+uid(),kind:'token',name,sub:'listrik',day:1,estimate:0,acc:t.acc,active:true};d.bills.push(b)}t.bid=b.id});
return d}
let S=blank(),storageOK=true,loadError=false,view='beranda',kindF='',debtTab='hutang',persenG='',month=today().slice(0,7),filt={q:'',type:'',acc:''},openBill=null;
const valid=d=>d&&Array.isArray(d.accounts)&&Array.isArray(d.cats)&&Array.isArray(d.tx)&&Array.isArray(d.bills)&&Array.isArray(d.tokens);
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(valid(d))S=normalize(Object.assign(blank(),d));else loadError=true}}catch(e){storageOK=false}
function save(){if(loadError)return;try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}

const allSubs=()=>S.cats.flatMap(c=>c.subs.map(s=>({...s,cat:c,g:c.g})));
function subOf(id){return allSubs().find(s=>s.id===id)}
const incOf=id=>INC.find(x=>x[0]===id)||INC[4];
const accOf=id=>S.accounts.find(a=>a.id===id);
const icon=(i,c,s)=>`<span class="ico${s?' s':''}" style="--c:${esc(c||'#04758f')}" aria-hidden="true">${esc(i)}</span>`;
const subIcon=(id,s)=>{const x=subOf(id);return x?icon(x.i,x.cat.c,s):icon('❔','#888',s)};
const subName=id=>subOf(id)?.n||'Tanpa kategori';
const accName=id=>id?(accOf(id)?.name||'?'):'Tanpa potong saldo';
function balance(id){const a=accOf(id);return S.tx.reduce((b,t)=>{if(t.type==='in'&&t.acc===id)b+=t.amount;if(t.type==='out'&&t.acc===id)b-=t.amount;if(t.type==='debt'&&t.acc===id)b+=t.dir*t.amount;if(t.type==='move'){if(t.acc===id)b-=t.amount+(0);if(t.to===id)b+=t.amount}return b},a?a.open:0)}
const inMonth=m=>S.tx.filter(t=>t.date.startsWith(m));
// Pengeluaran per sub; transfer bertanda tabungan ikut dihitung sebagai tabungan
function spent(m){const o={};for(const t of inMonth(m)){if((t.type==='out'||t.type==='move')&&t.sub)o[t.sub]=(o[t.sub]||0)+t.amount}return o}
function totals(m){const t={in:0,needs:0,wants:0,save:0};for(const x of inMonth(m))if(x.type==='in')t.in+=x.amount;const o=spent(m);for(const k in o){t[subOf(k)?.g||'needs']+=o[k]}t.out=t.needs+t.wants;return t}

/* ---------- Tagihan ---------- */
const payments=id=>S.tx.filter(t=>t.billId===id).sort((a,b)=>a.period.localeCompare(b.period)||a.date.localeCompare(b.date));
// gabungkan pembayaran per periode (mendukung cicilan)
function periods(id){const o={};for(const t of payments(id)){(o[t.period]??={period:t.period,amount:0,items:[]});o[t.period].amount+=t.amount;o[t.period].items.push(t)}return Object.values(o)}
function billEst(b){const p=periods(b.id).slice(-3);return p.length?sum(p,x=>x.amount)/p.length:b.estimate}
function delta(now,prev){if(prev==null)return '<span class="pill">Data pertama</span>';const d=now-prev;if(!d)return '<span class="pill">● Tetap</span>';const pc=prev?` (${dec(Math.abs(d/prev*100))}%)`:'';return d>0?`<span class="pill bad">▲ Naik ${rp(d)}${pc}</span>`:`<span class="pill good">▼ Turun ${rp(-d)}${pc}</span>`}
function billStatus(b,m){if(periods(b.id).some(p=>p.period===m))return{k:'paid',t:'Lunas',c:'good'};const n=days(today(),dayIn(m,b.day));if(n<0)return{k:'late',t:`Belum dicatat, lewat ${-n} hari`,c:'bad'};return{k:'due',t:n===0?'Jatuh tempo hari ini':`${n} hari lagi`,c:n<=5?'warn':'mut'}}

/* ---------- Token listrik ---------- */
function tokenStats(list){const a=[...list].sort((x,y)=>x.date.localeCompare(y.date));let used=0,span=0;const gaps=[];
const rows=a.map((t,i)=>{const r={...t};if(i){const p=a[i-1],g=days(p.date,t.date);r.gap=g;if(gaps.length){const avg=sum(gaps,x=>x)/gaps.length;r.shift=Math.round(g-avg)}
if(g>0){gaps.push(g);const both=p.left!=null&&t.left!=null;const u=Math.max(0,both?p.left+p.kwh-t.left:p.kwh);used+=u;span+=g}}return r});
const rate=span?used/span:0,last=a[a.length-1],avgGap=gaps.length?sum(gaps,x=>x)/gaps.length:0;
const price=sum(a,x=>x.kwh)?sum(a,x=>x.amount)/sum(a,x=>x.kwh):0;
let next=null;if(last&&rate>0)next=addDays(last.date,Math.floor((last.kwh+(last.left||0))/rate));
return{rows,rate,avgGap,next,price,monthly:rate*30*price}}
const tokensOf=id=>S.tokens.filter(t=>t.bid===id);
const meterBills=()=>S.bills.filter(b=>b.kind==='token');
/* ---------- Hutang / piutang ---------- */
const debtPays=id=>S.tx.filter(t=>t.debtId===id&&!t.debtInit);
const debtPaid=d=>sum(debtPays(d.id),t=>t.amount);
const debtLeft=d=>Math.max(0,d.amount-debtPaid(d));
function debtStatus(d){if(!debtLeft(d))return{t:'Lunas',c:'good'};if(!d.due)return{t:'Tanpa jatuh tempo',c:'mut'};const n=days(today(),d.due);return n<0?{t:`Lewat jatuh tempo ${-n} hari`,c:'bad'}:{t:n?`Jatuh tempo ${n} hari lagi`:'Jatuh tempo hari ini',c:n<=7?'warn':'mut'}}

/* ---------- Saran budget ---------- */
function basisIncome(m){if(S.incomePlan)return{v:S.incomePlan,t:'target pemasukan yang Anda isi'};const now=totals(m).in;const prev=[1,2,3].map(i=>totals(addM(m,-i)).in).filter(v=>v);const avg=prev.length?sum(prev,x=>x)/prev.length:0;
if(avg)return{v:avg,t:`rata-rata pemasukan ${prev.length} bulan sebelumnya`};return{v:now,t:'pemasukan bulan ini'}}
function suggest(m){const inc=basisIncome(m).v;const past=[1,2,3].map(i=>addM(m,-i)).filter(x=>Object.keys(spent(x)).length);const hist=past.map(spent),cur=spent(m);
const subs=allSubs().map(s=>{let base=0,why='';if(hist.length){base=sum(hist,h=>h[s.id]||0)/hist.length;if(base)why=`rata-rata ${hist.length} bulan`}else if(cur[s.id]){base=cur[s.id];why='pengeluaran bulan ini'}
const bills=S.bills.filter(b=>b.active&&b.kind!=='token'&&b.sub===s.id);const be=sum(bills,billEst);if(be>base){base=be;why='perkiraan tagihan rutin'}
let fixed=s.f||bills.length>0;if(s.id==='listrik'){const tk=sum(meterBills().filter(b=>b.active),b=>tokenStats(tokensOf(b.id)).monthly);if(tk){base=tk+be;why='pemakaian token per 30 hari'+(be?' + tagihan':'')}}
return{...s,base,why,fixed,sug:0}});
const res={};for(const g in GROUPS){const pool=inc*S.pct[g]/100,L=subs.filter(s=>s.g===g),tot=sum(L,s=>s.base);
if(g==='save'||!tot){const W=sum(L,s=>s.w||0)||1;L.forEach(s=>{s.sug=pool*(s.w||0)/W;s.why=g==='save'?'porsi dari jatah tabungan':'contoh awal, belum ada riwayat'})}
else if(tot<=pool){L.forEach(s=>s.sug=s.base)}
else{const fx=sum(L.filter(s=>s.fixed),s=>s.base),fl=tot-fx;L.forEach(s=>{if(fx>=pool)s.sug=s.fixed?s.base*pool/fx:0;else s.sug=s.fixed?s.base:s.base*(pool-fx)/fl;
if(s.base)s.why+=s.fixed?(fx>=pool?', ikut dipangkas':', pos tetap'):', disarankan hemat'})}
L.forEach(s=>s.sug=Math.floor(s.sug/1000)*1000);
res[g]={pool,tot:g==='save'?0:tot,fixed:sum(L.filter(s=>s.fixed),s=>s.base),subs:L,free:Math.max(0,pool-sum(L,s=>s.sug))}}return res}

let h=head('Saran Budget',monthNav())+`<div class="card"><div class="row between"><div><b class="num" style="font-size:20px">${rp(b.v)}</b><div class="sm mut">Dasar hitungan: ${b.t}</div></div><div class="row">${btn('plan','Atur pemasukan & persentase')}${b.v?btn('apply','Pakai semua saran','','p'):''}</div></div><div class="sm mut">Saran dihitung dari riwayat pengeluaran, tagihan rutin, dan pemakaian token. Jika melebihi jatah, pos tidak tetap dikurangi lebih dulu. “Budget” adalah angka yang Anda pakai dan bisa diubah.</div></div>`;

function sanitize(d){const walk=(v,k)=>{if(Array.isArray(v))return v.map(x=>walk(x));if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,walk(x,k)]));if(k==='due')return /^\d{4}-\d\d-\d\d$/.test(v)?v:'';if(['dir','amount','open','kwh','estimate','day','incomePlan','w'].includes(k))return Number(v)||0;if(k==='left')return v==null?null:Number(v)||0;if(['date','period'].includes(k))return /^\d{4}-\d\d(-\d\d)?$/.test(v)?v:today().slice(0,k==='date'?10:7);return v};const x=walk(d);x.accounts.forEach(a=>{if(!TYPES[a.type])a.type='cash'});x.cats.forEach(c=>{if(!GROUPS[c.g])c.g='needs'});x.pct={needs:+x.pct?.needs||0,wants:+x.pct?.wants||0,save:+x.pct?.save||0};return x}

function subForm(s){form(s?'Ubah sub kategori':'Tambah sub kategori',[['cat','Kategori induk','select',s?.cat.id||S.cats[0].id,S.cats.map(c=>[c.id,c.i+' '+c.n])],['n','Nama sub kategori','text',s?.n||''],['i','Logo (ketik atau tempel satu emoji)','text',s?.i||'🏷️'],['f','Pos tetap (tidak diutamakan untuk dipangkas)','check',s?.f]],d=>{if(!d.n.trim())return fail('Isi nama sub kategori.');const o={id:s?.id||uid(),n:d.n.trim(),i:d.i.trim()||'🏷️',f:d.f,w:s?.w||0};S.cats.forEach(c=>c.subs=c.subs.filter(x=>x.id!==o.id));S.cats.find(c=>c.id===d.cat).subs.push(o);commit('Sub kategori disimpan')},s?btn('delsub','Hapus',s.id,'d'):'')}
